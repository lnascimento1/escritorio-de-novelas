name: Fabricar apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK para Android
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: node build.js
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk escritorio-de-novelas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: escritorio-de-novelas.apk

  windows:
    name: Instalador para Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node build.js
      - name: Compilar instalador
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Renombrar
        shell: bash
        run: cp dist/*.exe escritorio-de-novelas-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: escritorio-de-novelas-windows.exe

  release:
    name: Publicar versión
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versión ${{ github.run_number }}
          body: |
            Descargas:
            - Android: escritorio-de-novelas.apk
            - Windows: escritorio-de-novelas-windows.exe
          files: |
            escritorio-de-novelas.apk
            escritorio-de-novelas-windows.exe
